# Copy of /etc/nginx/sites-available/delafun-calculator on the VPS (symlinked in sites-enabled).
# HTTPS: certbot --nginx -d calc.cmdev.ro  (certbot adds the 443 / redirect blocks itself).
# Cockpit panel password: /etc/nginx/.htpasswd-delafun-calculator-cockpit
#   (create with: sudo htpasswd -c /etc/nginx/.htpasswd-delafun-calculator-cockpit admin)
#
# /var/www/delafun-calculator/
# ├── public_html/   build-ul aplicatiei (dist/pwa), inlocuit la fiecare deploy
# └── cockpit/       Cockpit CMS, la https://calc.cmdev.ro/cockpit

# Everything of Cockpit asks for an extra password, except the app's own endpoints (/cockpit/api/calc/*,
# which check the paired device themselves). Cockpit's standard REST / GraphQL API is not used by the app.
# Decided on the raw request (what Cockpit routes on), with no path tricks allowed.
map $request_uri $calc_cockpit_auth {
    "~*^/cockpit/api/[^?]*(\.\.|%2e|%2f|%5c|\x5c|//)" "Cockpit";
    "~^/cockpit/api/calc/[a-z]+(\?|$)" off;
    default "Cockpit";
}

# Pairing tries per address (a wrong code also counts against the open code).
limit_req_zone $binary_remote_addr zone=calc_pair:1m rate=10r/m;

server {
    server_name calc.cmdev.ro;

    root /var/www/delafun-calculator;
    index index.php index.html;
    client_max_body_size 2M;
    server_tokens off;

    # Applies where a location sets no headers of its own (Cockpit); the app's locations repeat them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ /\.(?!well-known) { deny all; }

    # ---- Cockpit ----
    location ~ ^/cockpit/(install|config|storage|lib|modules/.+\.php|tower|cron\.php|bootstrap\.php|composer\.(json|lock)|package\.json|[^/]+\.md$|LICENSE) {
        deny all;
    }
    location = /cockpit/api/calc/pair {
        limit_req zone=calc_pair burst=5 nodelay;
        limit_req_status 429;
        auth_basic $calc_cockpit_auth;
        auth_basic_user_file /etc/nginx/.htpasswd-delafun-calculator-cockpit;
        try_files $uri /cockpit/index.php?$query_string;
    }
    location /cockpit {
        auth_basic $calc_cockpit_auth;
        auth_basic_user_file /etc/nginx/.htpasswd-delafun-calculator-cockpit;
        try_files $uri $uri/ /cockpit/index.php?$query_string;
    }
    location ~ ^/cockpit/.+\.php$ {
        auth_basic $calc_cockpit_auth;
        auth_basic_user_file /etc/nginx/.htpasswd-delafun-calculator-cockpit;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Server-side scripts (provisioning, pairing) are never served.
    location ^~ /deploy/ { deny all; }

    # ---- App (Quasar PWA, static files from public_html) ----
    location / {
        root /var/www/delafun-calculator/public_html;
        # History mode: unknown paths fall back to the app's index.html.
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Always fetch the app shell and service worker fresh, so a deploy shows up right away.
    location ~ ^/(index\.html|service-worker\.js|manifest\.json)$ {
        root /var/www/delafun-calculator/public_html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Hashed build assets never change for a given name.
    location ~ ^/(js|css|fonts|img)/ {
        root /var/www/delafun-calculator/public_html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/calc.cmdev.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/calc.cmdev.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = calc.cmdev.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name calc.cmdev.ro;
    return 404; # managed by Certbot


}