<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Aplicație indisponibilă</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      background: #ACD0DB; color: #1d2b30;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Aplicația nu mai este disponibilă</h1>
    <p>Această versiune a calculatorului a fost oprită. Poți șterge iconița de pe ecranul telefonului.</p>
  </main>
  <script>
    // Belt and braces: drop any service worker and cache left by the old app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((reg) => reg.unregister()))
        .catch(() => {})
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key))).catch(() => {})
    }
  </script>
</body>
</html>
